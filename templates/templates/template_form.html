{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">{{ page_title }}</h1>
<div class="bg-white p-8 rounded-lg shadow-md max-w-lg mx-auto">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-6">
            <button type="submit" class="w-full bg-primary-600 text-white py-2 px-4 rounded-md hover:bg-primary-700">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}
