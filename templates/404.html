{% extends "base.html" %}

{% block title %}Страница не найдена (404){% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center max-w-xl">
        <h1 class="text-6xl font-bold text-primary-600">404</h1>
        <p class="text-2xl font-semibold text-gray-800 mt-4">Страница не найдена</p>
        <p class="text-gray-600 mt-2">
            К сожалению, мы не смогли найти страницу, которую вы искали. Возможно, вы ошиблись в адресе или ссылка устарела.
        </p>
        <div class="mt-6">
            <a href="{% url 'select_company' %}"
               class="px-6 py-3 bg-primary-600 text-white font-semibold rounded-md hover:bg-primary-700">
                Вернуться на главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
